name: uangku
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  sqflite: ^2.4.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.13.1 # Disahihkan sejajar dengan flutter_test
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/ # Jangan lupa un-comment ini agar asset terdaftar

# Konfigurasi di luar / sejajar paling kiri
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"